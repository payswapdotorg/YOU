openapi: 3.1.0
info:
  title: YOU API
  version: 1.0.0
  summary: Frozen v1 production contract surface (P6.T2). Paths are relative to the server URL (/v1).
  description: >-
    Complete inventory of the /v1 HTTP surface as implemented at freeze
    commit. This file is FROZEN: any change requires TL approval and a
    version bump, and must update contracts/SHA256SUMS.v1 in the same
    commit (CI enforces this via the contract-freeze gate).
servers:
  - url: https://api.you.example/v1
paths:
  /agent-avatar-sessions:
    post:
      summary: Agent avatar sessions
      responses: {"201": {"description": "Created"}}
  /agent-avatar-sessions/{id}:
    get:
      summary: Agent avatar sessions item
      responses: {"200": {"description": "OK"}}
    delete:
      summary: Agent avatar sessions item
      responses: {"204": {"description": "No Content"}}
  /agent-avatar-sessions/{id}/events:
    post:
      summary: Agent avatar sessions — emit event
      responses: {"201": {"description": "Created"}}
  /agent-bodies:
    get:
      summary: Agent bodies
      responses: {"200": {"description": "OK"}}
    post:
      summary: Agent bodies
      responses: {"201": {"description": "Created"}}
  /agent-bodies/{id}/possessions:
    post:
      summary: Agent bodies — attach possession
      responses: {"201": {"description": "Created"}}
  /agent-souls:
    get:
      summary: Agent souls
      responses: {"200": {"description": "OK"}}
  /agent/bodies:
    get:
      summary: Agent runtime bodies (P6.C6 production runtime)
      responses: {"200": {"description": "OK"}}
    post:
      summary: Agent runtime bodies — create (draft; activate via PATCH)
      responses: {"201": {"description": "Created"}, "400": {"description": "Bad Request"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /agent/bodies/{id}:
    get:
      summary: Agent runtime bodies item (with immutable version snapshots)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}}
    patch:
      summary: Agent runtime bodies — lifecycle action or versioned definition update
      responses: {"200": {"description": "OK"}, "400": {"description": "Bad Request"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /agent/souls:
    get:
      summary: Agent runtime souls (P6.C6 production runtime)
      responses: {"200": {"description": "OK"}}
    post:
      summary: Agent runtime souls — create (draft; activate via PATCH)
      responses: {"201": {"description": "Created"}, "400": {"description": "Bad Request"}, "404": {"description": "Not Found"}}
  /agent/souls/{id}:
    get:
      summary: Agent runtime souls item (with immutable version snapshots)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}}
    patch:
      summary: Agent runtime souls — lifecycle action or versioned definition update
      responses: {"200": {"description": "OK"}, "400": {"description": "Bad Request"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /agent/sessions:
    get:
      summary: Agent runtime sessions — list (newest first, bounded)
      responses: {"200": {"description": "OK"}}
    post:
      summary: Agent runtime sessions — bind (Twin, Body, Soul) with consent provenance
      responses: {"201": {"description": "Created"}, "400": {"description": "Bad Request"}, "403": {"description": "Forbidden"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /agent/sessions/{id}:
    get:
      summary: Agent runtime sessions item — real turn history with honest job-status join
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}}
    delete:
      summary: Agent runtime sessions — explicit teardown (live → ended; idempotent)
      responses: {"204": {"description": "No Content"}, "404": {"description": "Not Found"}}
  /agent/sessions/{id}/turns:
    post:
      summary: Agent runtime sessions — submit a chat turn (durable agent.turn job; consent re-verified)
      responses: {"202": {"description": "Accepted"}, "400": {"description": "Bad Request"}, "403": {"description": "Forbidden"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}, "503": {"description": "Service Unavailable"}}
  /api-keys:
    get:
      summary: API keys
      responses: {"200": {"description": "OK"}}
    post:
      summary: API keys
      responses: {"201": {"description": "Created"}}
  /api-keys/{id}:
    delete:
      summary: API keys item
      responses: {"204": {"description": "No Content"}}
  /api-keys/{id}/rotate:
    post:
      summary: API keys — rotate secret in place
      responses: {"201": {"description": "Created"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /artifacts:
    get:
      summary: Solution artifacts list — filter by twinVersionId/renderJobId/type/performanceId (P6.B6)
      responses: {"200": {"description": "OK"}}
  /artifacts/{id}:
    get:
      summary: Solution artifacts item
      responses: {"200": {"description": "OK"}}
  /captures:
    get:
      summary: Capture sessions
      responses: {"200": {"description": "OK"}}
  /captures/{id}:
    get:
      summary: Capture sessions item
      responses: {"200": {"description": "OK"}}
  /captures/{id}/assets:
    post:
      summary: Capture sessions — attach assets
      responses: {"201": {"description": "Created"}}
  /captures/{id}/complete:
    post:
      summary: Capture sessions — complete
      responses: {"202": {"description": "Accepted"}}
  /captures/{id}/reconstruct:
    post:
      summary: Capture sessions — F1 reconstruction (consent-gated, P6.C4)
      responses: {"202": {"description": "Accepted"}}
  /captures/{id}/f1:
    delete:
      summary: F1 guided capture flow — delete session honoring retention policy (P6.B3)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}}
  /captures/{id}/f1/complete:
    post:
      summary: F1 guided capture flow — complete + content-addressed manifest (P6.B3)
      responses: {"202": {"description": "Accepted"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /captures/{id}/f1/export:
    get:
      summary: F1 guided capture flow — evidence export (P6.B3)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}}
  /captures/{id}/f1/review:
    post:
      summary: F1 guided capture flow — review → TwinVersion promotion (P6.B3)
      responses: {"202": {"description": "Accepted"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /captures/{id}/f1/steps/{stepId}/skip:
    post:
      summary: F1 guided capture flow — skip step with reason (P6.B3)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /captures/{id}/f1/steps/{stepId}/submit:
    post:
      summary: F1 guided capture flow — submit step asset (consent-gated, P6.B3)
      responses: {"202": {"description": "Accepted"}, "400": {"description": "Bad Request"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}}
  /twins/{id}/capture-sessions/f1:
    post:
      summary: F1 guided capture session — create (consent-gated, P6.B3)
      responses: {"201": {"description": "Created"}, "403": {"description": "Forbidden"}, "404": {"description": "Not Found"}}
  /consent-grants:
    get:
      summary: Consent grants
      responses: {"200": {"description": "OK"}}
    post:
      summary: Consent grants
      responses: {"201": {"description": "Created"}}
  /consent-grants/{id}:
    delete:
      summary: Consent grants item
      responses: {"204": {"description": "No Content"}}
  /events:
    get:
      summary: Events
      responses: {"200": {"description": "OK"}}
  /evidence-requests:
    get:
      summary: Evidence requests
      responses: {"200": {"description": "OK"}}
    post:
      summary: Evidence requests
      responses: {"201": {"description": "Created"}}
  /evidence-requests/{id}/fulfill:
    post:
      summary: Evidence requests — fulfill
      responses: {"201": {"description": "Created"}}
  /evidence/{id}/url:
    get:
      summary: Evidence URLs — signed URL
      responses: {"200": {"description": "OK"}}
  /feedback:
    post:
      summary: Feedback
      responses: {"201": {"description": "Created"}}
  /health:
    get:
      summary: Health — unauthenticated liveness + readiness (db probe)
      responses: {"200": {"description": "OK"}, "503": {"description": "Service Unavailable"}}
  /jobs/{id}:
    get:
      summary: Jobs item
      responses: {"200": {"description": "OK"}}
  /lab/failures:
    get:
      summary: lab — failure catalogue
      responses: {"200": {"description": "OK"}}
  /lab/objectives:
    get:
      summary: lab — objectives
      responses: {"200": {"description": "OK"}}
    post:
      summary: lab — objectives
      responses: {"201": {"description": "Created"}}
  /lab/pipelines:
    get:
      summary: lab — pipelines
      responses: {"200": {"description": "OK"}}
  /lab/promotions:
    get:
      summary: lab — promotions
      responses: {"200": {"description": "OK"}}
  /lab/runs:
    post:
      summary: lab — runs
      responses: {"202": {"description": "Accepted"}}
  /lab/runs/{id}:
    get:
      summary: lab item
      responses: {"200": {"description": "OK"}}
  /lab/technologies:
    get:
      summary: lab — technologies
      responses: {"200": {"description": "OK"}}
  /live-sessions:
    get:
      summary: Live sessions — list (P6.C7 realtime path; consent-scoped)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}}
    post:
      summary: Live sessions — create (consent-enforced, returns signaling token; P6.C7)
      responses: {"201": {"description": "Created"}, "403": {"description": "Forbidden"}, "401": {"description": "Unauthorized"}}
  /live-sessions/{id}:
    get:
      summary: Live session detail (signaling state; P6.C7)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}, "401": {"description": "Unauthorized"}}
  /live-sessions/{id}/signal:
    get:
      summary: Live signaling — poll relayed SDP/ICE (HTTP polling v1; P6.C7)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}, "401": {"description": "Unauthorized"}}
    post:
      summary: Live signaling — relay SDP offer/answer + ICE candidates (honest 409 on wrong state; P6.C7)
      responses: {"200": {"description": "OK"}, "409": {"description": "Conflict"}, "404": {"description": "Not Found"}, "401": {"description": "Unauthorized"}}
  /live-sessions/{id}/state:
    post:
      summary: Live performance state events (idempotent, bounded ring; P6.C7)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}, "401": {"description": "Unauthorized"}}
  /live-sessions/{id}/end:
    post:
      summary: End a live session (terminal; P6.C7)
      responses: {"204": {"description": "No Content"}, "404": {"description": "Not Found"}, "401": {"description": "Unauthorized"}}
  /agent/providers:
    get:
      summary: Agent provider registry surface — available/unavailable + reason per provider (fail-closed; P6.B7)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}}
  /agent/sessions/{id}/interrupt:
    post:
      summary: Interrupt a running agent session turn (honest interrupted state; P6.B7)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}, "409": {"description": "Conflict"}, "401": {"description": "Unauthorized"}}
  /try-on:
    get:
      summary: Virtual try-on — list try-on jobs (consent-enforced; P6.C8)
      responses: {"200": {"description": "OK"}}
    post:
      summary: Virtual try-on — create try-on render (durable tryon.render job, idempotent; P6.C8)
      responses: {"202": {"description": "Accepted"}, "400": {"description": "Bad Request"}, "403": {"description": "Forbidden"}, "409": {"description": "Conflict"}, "401": {"description": "Unauthorized"}}
  /try-on/{id}:
    get:
      summary: Virtual try-on — job detail + comparison artifact with signed URLs (P6.C8)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}}
  /try-on/garments:
    get:
      summary: Try-on garments — list garment assets (P6.C8)
      responses: {"200": {"description": "OK"}}
    post:
      summary: Try-on garments — multipart garment upload (content-addressed, merchant provenance; P6.C8)
      responses: {"201": {"description": "Created"}, "400": {"description": "Bad Request"}, "413": {"description": "Payload Too Large"}, "429": {"description": "Too Many Requests"}, "401": {"description": "Unauthorized"}}
  /try-on/garments/{id}:
    get:
      summary: Try-on garments — garment detail (P6.C8)
      responses: {"200": {"description": "OK"}, "404": {"description": "Not Found"}}
  /develop/playground:
    get:
      summary: Develop playground — sandbox status + frozen-inventory count (P6.B9)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}}
  /develop/playground/execute:
    post:
      summary: Develop playground — execute an operation against the real API (mutation-confirmation gated, rate-limited; P6.B9)
      responses: {"200": {"description": "OK"}, "400": {"description": "Bad Request"}, "401": {"description": "Unauthorized"}, "409": {"description": "Conflict"}, "429": {"description": "Too Many Requests"}}
  /maintenance/dead-jobs:
    get:
      summary: Maintenance — list dead-lettered jobs (operator session)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}, "403": {"description": "Forbidden"}}
    post:
      summary: Maintenance — replay or purge dead-lettered jobs (operator session)
      responses: {"200": {"description": "OK"}, "400": {"description": "Bad Request"}, "401": {"description": "Unauthorized"}, "403": {"description": "Forbidden"}}
  /maintenance/gc-storage:
    post:
      summary: Maintenance — sweep unreferenced storage objects (durable job)
      responses: {"202": {"description": "Accepted"}, "403": {"description": "Forbidden"}}
  /maintenance/expire-evidence-requests:
    post:
      summary: Maintenance — expire open evidence requests past the TTL (P6.B5; active fulfillment captures are skipped)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}, "403": {"description": "Forbidden"}}
  /maintenance/provider-breaker:
    get:
      summary: Maintenance — provider circuit-breaker state snapshot (operator session)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}, "403": {"description": "Forbidden"}}
    post:
      summary: Maintenance — reset or trip a provider circuit breaker (operator session)
      responses: {"200": {"description": "OK"}, "400": {"description": "Bad Request"}, "401": {"description": "Unauthorized"}, "403": {"description": "Forbidden"}}
  /metrics:
    get:
      summary: Operational metrics — retry/dead-job/breaker/rate-limit counters (operator session)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}, "403": {"description": "Forbidden"}}
  /overview:
    get:
      summary: Overview
      responses: {"200": {"description": "OK"}}
  /performances:
    get:
      summary: Performances
      responses: {"200": {"description": "OK"}}
    post:
      summary: Performances
      responses: {"201": {"description": "Created"}}
  /performances/from-text:
    post:
      summary: Performances — create from text
      responses: {"202": {"description": "Accepted"}}
  /performances/{id}:
    get:
      summary: Performances item
      responses: {"200": {"description": "OK"}}
  /renders:
    get:
      summary: Renders
      responses: {"200": {"description": "OK"}}
    post:
      summary: Renders
      responses: {"202": {"description": "Accepted"}}
  /renders/{id}:
    get:
      summary: Renders item
      responses: {"200": {"description": "OK"}}
  /session:
    get:
      summary: Client session
      responses: {"200": {"description": "OK"}}
    post:
      summary: Client session
      responses: {"201": {"description": "Created"}}
  /storage/{key}:
    get:
      summary: Storage read-through item
      responses: {"200": {"description": "OK"}}
  /subjects/{id}/export:
    get:
      summary: Subjects — portable data export (rows + expiring evidence capabilities)
      responses: {"200": {"description": "OK"}}
  /templates:
    get:
      summary: Templates
      responses: {"200": {"description": "OK"}}
    post:
      summary: Templates
      responses: {"200": {"description": "OK"}, "201": {"description": "Created"}}
  /templates/{id}:
    get:
      summary: Templates item
      responses: {"200": {"description": "OK"}}
  /templates/{id}/analyze:
    post:
      summary: Templates — analyze
      responses: {"202": {"description": "Accepted"}}
  /twins:
    get:
      summary: Twins
      responses: {"200": {"description": "OK"}}
    post:
      summary: Twins
      responses: {"201": {"description": "Created"}}
  /twins/{id}/deficiencies:
    get:
      summary: Twin deficiency report — per-capability honest states (ok/deficient/unknown) with sources and remedy payloads (P6.B4)
      responses: {"200": {"description": "OK"}, "401": {"description": "Unauthorized"}, "404": {"description": "Not Found"}}
  /twins/{id}:
    get:
      summary: Twins item
      responses: {"200": {"description": "OK"}}
    delete:
      summary: Twins item
      responses: {"204": {"description": "No Content"}}
  /twins/{id}/capture-sessions:
    post:
      summary: Twins — capture-sessions
      responses: {"201": {"description": "Created"}}
  /twins/{id}/compile:
    post:
      summary: Twins — compile
      responses: {"202": {"description": "Accepted"}}
  /twins/{id}/versions:
    get:
      summary: Twins — list versions
      responses: {"200": {"description": "OK"}}
  /usage:
    get:
      summary: Usage metering
      responses: {"200": {"description": "OK"}}
  /verification-sessions:
    get:
      summary: Verification sessions
      responses: {"200": {"description": "OK"}}
    post:
      summary: Verification sessions
      responses: {"201": {"description": "Created"}}
  /verification-sessions/{id}:
    get:
      summary: Verification sessions item
      responses: {"200": {"description": "OK"}}
  /verification-sessions/{id}/evaluate:
    post:
      summary: Verification sessions — evaluate
      responses: {"201": {"description": "Created"}}
  /verification-sessions/{id}/evidence:
    post:
      summary: Verification sessions — attach evidence
      responses: {"201": {"description": "Created"}}
  /webhooks:
    get:
      summary: Webhooks
      responses: {"200": {"description": "OK"}}
    post:
      summary: Webhooks
      responses: {"201": {"description": "Created"}}
  /webhooks/{id}:
    delete:
      summary: Webhooks item
      responses: {"204": {"description": "No Content"}}
components:
  schemas:
    HTIR:
      $ref: '../htir/v1/htir.schema.json'
    LabWorld:
      $ref: '../lab/v1/world.schema.json'
    AgentPerformanceEvents:
      $ref: '../events/v1/agent-performance-events.schema.json'
